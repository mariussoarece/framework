# Everything that runs on the VPS.
#   cd infra && docker compose --env-file .env up -d
#
# Services:
#   db       PostgreSQL 16 (not reachable from the internet)
#   auth     Supabase Auth (GoTrue): sign-up, login, Google/Apple, password reset
#   rest     PostgREST: the automatic API over the database (Supabase's REST layer)
#   nginx    HTTPS entry point: /auth/v1, /rest/v1, /media (signed links)
#   api      Node.js server: uploads, FFmpeg, signed links, push, email, Stripe, account deletion
#   pgadmin  database admin, only on 127.0.0.1:5050 (open it through an SSH tunnel)

name: framework

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:${GOTRUE_VERSION}
    # Postfix on this same VPS: inside the containers, the mail server's name points to the VPS
    # itself (host-gateway), so the TLS certificate still matches. Unused when SMTP_LOCAL_NAME is empty.
    extra_hosts:
      - "${SMTP_LOCAL_NAME:-local-smtp.invalid}:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@db:5432/${POSTGRES_DB}?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      # links in emails: the sign-in service is reached under /auth/v1 (through nginx),
      # its default "/verify" would lose that prefix and end in a 404
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_SENDER}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/v1/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: https://${DOMAIN}/auth/v1/callback

  rest:
    image: postgrest/postgrest:${POSTGREST_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_OPENAPI_MODE: disabled

  api:
    build: ../server
    # Postfix on this same VPS: inside the containers, the mail server's name points to the VPS
    # itself (host-gateway), so the TLS certificate still matches. Unused when SMTP_LOCAL_NAME is empty.
    extra_hosts:
      - "${SMTP_LOCAL_NAME:-local-smtp.invalid}:host-gateway"
    restart: unless-stopped
    depends_on: [auth, rest]
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      REST_URL: http://rest:3000
      AUTH_URL: http://auth:9999
      MEDIA_ROOT_IN_CONTAINER: /srv/media
    volumes:
      - ${MEDIA_ROOT}:/srv/media
      - ./secrets:/run/secrets:ro      # AuthKey_XXXX.p8 (Apple), firebase-service-account.json (Google)

  nginx:
    image: nginx:${NGINX_VERSION}
    restart: unless-stopped
    depends_on: [auth, rest, api]
    # standalone:   this container owns ports 80/443 and does HTTPS itself
    # behind-proxy: the VPS's own nginx does HTTPS and forwards to NGINX_HTTP_BIND (127.0.0.1:8088)
    ports:
      - "${NGINX_HTTP_BIND:-80}:80"
      - "${NGINX_HTTPS_BIND:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET}
    volumes:
      - ./nginx/${NGINX_MODE:-standalone}:/etc/nginx/templates:ro
      - ./web:/usr/share/nginx/web:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      - ${MEDIA_ROOT}/published:/srv/media/published:ro

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
  certbot-www:
